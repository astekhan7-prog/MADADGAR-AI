

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MADADGAR AI</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#06152e,#075b75);
  color: white;
  text-align: center;
  min-height: 100vh;
}
header { padding: 35px 10px; }
h1 { color: #35e0d0; font-size: 35px; }
.card {
  background: white;
  color: #17243a;
  max-width: 500px;
  margin: 15px auto;
  padding: 25px;
  border-radius: 18px;
  width: 85%;
  box-sizing: border-box;
}
input {
  width: 95%;
  padding: 14px;
  border: 1px solid #aaa;
  border-radius: 9px;
  box-sizing: border-box;
  font-size: 16px;
}
button {
  background: #087e91;
  color: white;
  border: 0;
  padding: 13px 30px;
  margin-top: 12px;
  border-radius: 9px;
  font-size: 17px;
}
#messages { margin-top: 20px; overflow-wrap: anywhere; }
footer { padding: 25px; }
</style>
</head>
<body>

<header>
<h1>🌍 MADADGAR AI</h1>
<h3>Helping People Around the World</h3>
<p>آپ کا اپنا مددگار AI</p>
<p>مساعدك الذكي في كل مكان</p>
</header>

<div class="card">
<h2>Welcome to MADADGAR AI ❤️</h2>
<p>Ask me anything. I am here to help you!</p>

<input id="question" type="text"
placeholder="Write your question here...">

<br>
<button onclick="sendMessage()">Send</button>

<div id="messages"></div>
</div>

<footer>
Created by Asad Khan ❤️
</footer>

<script>
function sendMessage() {
  let input = document.getElementById("question");
  let messages = document.getElementById("messages");
  let question = input.value.trim();

  if (!question) {
    alert("Please write your question!");
    return;
  }

  let user = document.createElement("p");
  user.textContent = "You: " + question;
  messages.appendChild(user);

  let reply = document.createElement("p");
  reply.textContent =
    "MADADGAR AI: Thank you! I am being developed. Real AI connection is coming soon.";
  messages.appendChild(reply);

  input.value = "";
}
</script>
</body>
  </html>
